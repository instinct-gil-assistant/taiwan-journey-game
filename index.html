<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071510"><title>פורמוזה - בנה את הטיול שלך בטאיוואן</title>
<meta name="description" content="משחק מסע אינטראקטיבי בטאיוואן. הבחירות שלך, המזל של הדרך.">
<style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap');
:root{--bg:#071510;--panel:#0d2119;--panel2:#133026;--line:#214638;--text:#f2fff9;--muted:#91b7a8;--mint:#63e6be;--gold:#ffd166;--red:#ff7b7b;--blue:#74c0fc;--radius:20px}*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at 80% -20%,#1b664c 0,transparent 37%),var(--bg);color:var(--text);font-family:Heebo,system-ui,sans-serif;min-height:100%;-webkit-font-smoothing:antialiased}button,input{font:inherit}.app{max-width:1050px;margin:auto;padding:18px;min-height:100dvh}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{font-weight:900;font-size:22px;letter-spacing:-.5px}.brand i{font-style:normal;color:var(--mint)}.pill{border:1px solid var(--line);background:#0b1d16b8;padding:8px 12px;border-radius:999px;color:var(--muted)}.hero{min-height:75dvh;display:grid;place-items:center;text-align:center}.hero-inner{max-width:720px}.sun{width:112px;height:112px;border-radius:50%;background:#fff;margin:0 auto 28px;position:relative;box-shadow:0 0 80px #63e6be3d}.sun:after{content:'台灣';position:absolute;inset:0;display:grid;place-items:center;color:#0c3d2d;font-weight:900;font-size:28px}.h1{font-size:clamp(48px,10vw,92px);line-height:.9;margin:0;font-weight:900;letter-spacing:-4px}.sub{font-size:clamp(19px,4vw,27px);color:var(--muted);margin:24px auto 36px;max-width:600px}.btn{border:0;border-radius:16px;padding:15px 22px;font-weight:800;cursor:pointer;transition:.2s;min-height:54px}.btn:hover{transform:translateY(-2px)}.primary{background:var(--mint);color:#052017;box-shadow:0 12px 35px #63e6be25}.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line)}.wide{width:100%}.screen{display:none}.screen.active{display:block}.panel{background:linear-gradient(145deg,#10271e,#0b1d17);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:0 20px 60px #0004}.setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{margin:16px 0}.label{font-size:14px;color:var(--muted);margin-bottom:7px}.input{width:100%;background:#071710;border:1px solid var(--line);color:var(--text);border-radius:13px;padding:14px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.chip{padding:13px 8px;border:1px solid var(--line);border-radius:13px;background:#0a1b14;color:var(--muted);cursor:pointer}.chip.on{border-color:var(--mint);background:#173b2d;color:var(--text)}.mapcard{min-height:260px;display:grid;place-items:center;background:linear-gradient(160deg,#173e30,#0b1d17);position:relative;overflow:hidden}.mapcard:before{content:'台';position:absolute;font-size:300px;font-weight:900;color:#ffffff08;transform:rotate(-10deg)}.passport{width:150px;height:205px;border-radius:12px;background:#0b5d44;border:2px solid #d8b768;padding:24px;text-align:center;box-shadow:0 20px 30px #0005;position:relative;z-index:1}.passport .seal{font-size:54px;margin:13px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stat{background:var(--panel);border:1px solid var(--line);padding:12px;border-radius:14px}.stat b{display:block;font-size:19px}.stat span{font-size:12px;color:var(--muted)}.bar{height:5px;background:#06140f;border-radius:9px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--mint);transition:.5s}.journey-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:12px}.day{color:var(--mint);font-weight:800}.location{font-size:clamp(30px,7vw,55px);font-weight:900;margin:0;line-height:1}.scene{padding:0;overflow:hidden}.scene-visual{height:250px;display:grid;place-items:center;font-size:95px;background:linear-gradient(135deg,#245943,#112d22);position:relative}.scene-visual:after{content:'';position:absolute;inset:auto 0 0;height:50%;background:linear-gradient(transparent,#0d2119)}.scene-body{padding:22px}.event-title{font-size:25px;font-weight:900;margin:0 0 7px}.event-copy{color:var(--muted);font-size:17px;line-height:1.55;margin:0 0 20px}.option{display:block;width:100%;text-align:right;background:#10271e;border:1px solid var(--line);color:var(--text);padding:16px;margin:9px 0;border-radius:14px;cursor:pointer;font-weight:700}.option small{display:block;color:var(--muted);font-weight:400;margin-top:3px}.option:hover{border-color:var(--mint);background:#16372a}.result{animation:pop .4s ease}.result-big{font-size:72px}.delta{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.delta span{padding:7px 10px;background:#071710;border-radius:99px;color:var(--muted)}.good{color:var(--mint)!important}.bad{color:var(--red)!important}@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.collection{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:12px}.stamp{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center;min-height:130px;display:grid;place-items:center}.stamp.lock{filter:grayscale(1);opacity:.35}.stamp .emoji{font-size:38px}.final{text-align:center;max-width:720px;margin:20px auto}.grade{width:150px;height:150px;border-radius:50%;border:8px solid var(--gold);display:grid;place-items:center;margin:20px auto;font-size:54px;font-weight:900;color:var(--gold)}.route{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;color:var(--muted);margin:20px}.route span:not(:last-child):after{content:' ←';color:var(--mint)}.note{font-size:12px;color:#5f8979;text-align:center;margin-top:22px}@media(max-width:700px){.setup-grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.choices{grid-template-columns:1fr}.app{padding:13px}.panel{padding:17px}.scene-visual{height:190px}.h1{letter-spacing:-2px}}
</style></head>
<body><div class="app">
<div class="top"><div class="brand">פורמוזה <i>旅</i></div><button class="pill" onclick="showCollection()">האוסף שלי · <span id="stampCount">0</span></button></div>
<section id="home" class="screen active hero"><div class="hero-inner"><div class="sun"></div><h1 class="h1">הטיול שלך.<br>הסיפור שלך.</h1><p class="sub">מטאיפיי ועד החוף המזרחי - אתם מקבלים את ההחלטות, והדרך עושה את השאר.</p><button class="btn primary" onclick="go('setup')">יוצאים לטאיוואן ←</button><div class="note">משחק מסע אינטראקטיבי · נשמר רק במכשיר הזה</div></div></section>
<section id="setup" class="screen"><div class="journey-head"><div><div class="day">לפני ההמראה</div><h2 class="location">בנו את הטיול</h2></div></div><div class="setup-grid"><div class="panel"><div class="field"><div class="label">מי מוביל את המסע?</div><input id="name" class="input" value="גיל ודנה" maxlength="24"></div><div class="field"><div class="label">קצב</div><div class="choices" data-key="pace"><button class="chip" data-value="רגוע">רגוע</button><button class="chip on" data-value="מאוזן">מאוזן</button><button class="chip" data-value="דחוס">דחוס</button></div></div><div class="field"><div class="label">המצפן שלכם</div><div class="choices" data-key="style"><button class="chip on" data-value="אוכל">אוכל</button><button class="chip" data-value="טבע">טבע</button><button class="chip" data-value="תרבות">תרבות</button></div></div><div class="field"><div class="label">אורך המסע</div><div class="choices" data-key="length"><button class="chip" data-value="6">6 ימים</button><button class="chip on" data-value="8">8 ימים</button><button class="chip" data-value="10">10 ימים</button></div></div><button class="btn primary wide" onclick="startGame()">אשרו וארזו מזוודה</button></div><div class="panel mapcard"><div class="passport"><b>TAIWAN</b><div class="seal">梅</div><small>REPUBLIC OF ADVENTURE</small></div></div></div></section>
<section id="game" class="screen"><div class="journey-head"><div><div id="day" class="day"></div><h2 id="loc" class="location"></h2></div><button class="pill" onclick="restart()">התחלה מחדש</button></div><div id="stats" class="stats"></div><div id="event" class="panel scene"></div></section>
<section id="collection" class="screen"><div class="journey-head"><div><div class="day">מזכרות מהדרך</div><h2 class="location">האוסף שלי</h2></div><button class="btn ghost" onclick="go(state.started?'game':'home')">חזרה</button></div><div id="stamps" class="collection"></div></section>
<section id="final" class="screen"><div class="panel final"><div class="day">המסע הושלם</div><h2 id="finalTitle" class="location"></h2><div id="grade" class="grade">A</div><p id="summary" class="event-copy"></p><div id="route" class="route"></div><div id="finalStats" class="stats"></div><button class="btn primary" onclick="restart()">בנו מסע חדש</button> <button class="btn ghost" onclick="showCollection()">פתחו את האוסף</button></div></section>
</div><script>
const EVENTS=[
{loc:'טאיפיי',icon:'🏮',title:'הלילה הראשון בשילין',text:'ריח הפלפל השחור, אורות ניאון והמון תורים. מאיפה מתחילים?',stamp:'שילין',opts:[['עוקבים אחרי התור הכי ארוך','הימור מקומי בטוח',{food:14,joy:8,budget:-6}],['טועמים סטינקי טופו','אמיצים או מצטערים',{culture:12,food:8,joy:-2}],['קונים מכל דוכן קצת','הכל, מיד',{food:18,budget:-14,energy:-5}]]},
{loc:'טאיפיי',icon:'🏙️',title:'העננים מכסים את Taipei 101',text:'יש כרטיס למצפה, אבל הראות גבולית. העיר לא מחכה.',stamp:'Taipei 101',opts:[['עולים בכל זאת','לפעמים העננים הם הסיפור',{joy:9,budget:-12,culture:4}],['יורדים ל-Xinyi ברגל','אדריכלות, חנויות ואנשים',{energy:-4,culture:10,budget:-4}],['מחליפים ל-Elephant Mountain','מטפסים בשביל הנוף',{energy:-13,joy:16,budget:0}]]},
{loc:'בייטואו',icon:'♨️',title:'גשם חם בעמק המעיינות',text:'אחרי בוקר רטוב, האדים עולים מכל פינה.',stamp:'בייטואו',opts:[['נכנסים למרחץ ציבורי','פשוט, מקומי ומדויק',{energy:16,culture:10,budget:-5}],['מתפנקים במלון מעיינות','הגוף אומר תודה',{energy:25,joy:12,budget:-22}],['ממשיכים למוזיאון המעיינות','נשארים יבשים, בערך',{culture:15,energy:4,budget:-2}]]},
{loc:'ג׳יופן',icon:'🏮',title:'הסמטאות נבלעות בערפל',text:'בתי התה זוהרים והאוטובוס האחרון חוזר בעוד שעה.',stamp:'ג׳יופן',opts:[['תה אולונג מול ההרים','עוצרים את הזמן',{joy:15,culture:12,budget:-9}],['מרוץ כדורי טארו','מתוק, מהיר וצפוף',{food:13,energy:-6,budget:-4}],['נשארים ללילה','החלטה ספונטנית גדולה',{joy:22,budget:-25,energy:10}]]},
{loc:'שיפן',icon:'🏮',title:'פנס משאלות ביד',text:'ארבעה צדדים ריקים. מה שולחים לשמיים?',stamp:'שיפן',opts:[['כותבים משאלה יחד','הרגע שיישאר',{joy:20,budget:-5}],['מוותרים מטעמי סביבה','משאירים רק תמונה',{culture:8,joy:5,budget:0}],['רצים למפל לפני החשיכה','הדרך יפה יותר מהיעד',{energy:-10,joy:14,culture:4}]]},
{loc:'טאינאן',icon:'🛕',title:'בוקר בין המקדשים',text:'תופים מעבר לפינה ודוכן קטן עם מרק בקר.',stamp:'טאינאן',opts:[['נכנסים לטקס','מקשיבים לפני שמצלמים',{culture:22,joy:7}],['הולכים בעקבות הריח','ארוחת בוקר שנייה',{food:20,budget:-6,energy:6}],['שוכרים אופניים','נותנים לסמטאות לבחור',{energy:-9,culture:12,joy:10}]]},
{loc:'אלישן',icon:'🌄',title:'שעון מעורר ב-04:10',text:'זריחה מעל ים העננים נשמעת טוב יותר בלילה.',stamp:'אלישן',opts:[['קמים ורצים לרכבת','עייפים ומאושרים',{energy:-18,joy:25,culture:6}],['ישנים עד שמונה','היער עדיין שם',{energy:22,joy:7}],['יוצאים ברגל בחושך','השביל שקט לגמרי',{energy:-22,joy:22,culture:8}]]},
{loc:'סאן מון לייק',icon:'🚲',title:'האגם או ההרים?',text:'הבוקר צלול ויש יום אחד בלבד באזור.',stamp:'סאן מון לייק',opts:[['מקיפים באופניים','הירכיים יזכרו',{energy:-16,joy:20,budget:-7}],['סירה בין המזחים','רוח, מים ועצלנות מוצדקת',{energy:8,joy:14,budget:-9}],['תה שחור בכפר איטה תאו','טעם של האזור',{food:12,culture:13,budget:-5}]]},
{loc:'הואליין',icon:'⛰️',title:'הדרך לערוץ טארוקו השתנתה',text:'מסלול אחד סגור. צריך לאלתר בלי לוותר על החוף המזרחי.',stamp:'הואליין',opts:[['מסלול חלופי בטוח','הדרך קודמת לתוכנית',{joy:12,culture:5,energy:-8}],['יום איטי בעיר','מוצ׳י, קפה והים',{food:14,joy:10,energy:12}],['רכבת צפונה לחוף קילאנ','סיבוב לא צפוי',{joy:17,budget:-11,energy:-5}]]},
{loc:'טאיטונג',icon:'🌊',title:'רוח פסיפית חזקה',text:'האוקיינוס כחול, הכביש פתוח והקטנוע החשמלי מחכה.',stamp:'טאיטונג',opts:[['יוצאים לאורך החוף','הרוח מנהלת את היום',{joy:23,energy:-12,budget:-9}],['סדנת תרבות ילידית','סיפור עמוק יותר מהנוף',{culture:23,budget:-8}],['שוקלים עוד קפה','לפעמים זה כל מה שצריך',{food:8,energy:14,budget:-4}]]},
{loc:'קאושיונג',icon:'🎨',title:'שקיעה ב-Pier-2',text:'אמנות, מחסנים ישנים ומעבורת לאי צ׳יג׳ין.',stamp:'קאושיונג',opts:[['עולים על המעבורת','השקיעה תופסת אתכם במים',{joy:20,budget:-4}],['נשארים בין המיצבים','אמנות לפני ארוחת ערב',{culture:17,joy:7}],['מחפשים פירות ים בצ׳יג׳ין','החלטה שמקבלים עם הבטן',{food:20,budget:-11,joy:8}]]},
{loc:'טאיפיי',icon:'🥟',title:'הערב האחרון',text:'נשארו כמה דולרים, קצת כוח והרבה מקומות שלא הספקתם.',stamp:'לילה אחרון',opts:[['Xiaolongbao חגיגי','מסיימים עם שולחן מלא',{food:22,joy:16,budget:-15}],['הליכת לילה בדאאן','משאירים מקום לגעגוע',{joy:17,energy:-6,culture:6}],['קריוקי עד הטיסה','הסוף הרועש ביותר',{joy:25,energy:-22,budget:-12}]]}
];
const ALL=EVENTS.map(e=>({name:e.stamp,icon:e.icon}));let state={started:false,day:0,length:8,events:[],stats:{energy:72,budget:100,food:20,culture:20,joy:40},stamps:[],route:[],name:'גיל ודנה'};
const labels={energy:'אנרגיה',budget:'תקציב',food:'אוכל',culture:'תרבות',joy:'כיף'},icons={energy:'⚡',budget:'NT$',food:'🥟',culture:'🏯',joy:'♥'};
document.querySelectorAll('.choices').forEach(g=>g.onclick=e=>{if(!e.target.matches('.chip'))return;g.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));e.target.classList.add('on')});
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');scrollTo(0,0)}
function startGame(){state={started:true,day:0,length:+sel('length'),events:shuffle(EVENTS.slice(0,-1)).slice(0,+sel('length')-1).concat(EVENTS.at(-1)),stats:{energy:72,budget:100,food:20,culture:20,joy:40},stamps:[],route:[],name:document.getElementById('name').value||'הנוסעים',pace:sel('pace'),style:sel('style')};save();go('game');renderEvent()}
function sel(k){return document.querySelector(`[data-key=${k}] .on`).dataset.value}function shuffle(a){return a.sort(()=>Math.random()-.5)}
function renderStats(where='stats'){document.getElementById(where).innerHTML=Object.entries(state.stats).filter(([k])=>k!=='joy'||where==='finalStats').map(([k,v])=>`<div class="stat"><b>${icons[k]} ${Math.round(v)}</b><span>${labels[k]}</span><div class="bar"><i style="width:${Math.max(0,Math.min(100,v))}%"></i></div></div>`).join('')}
function renderEvent(){if(state.day>=state.events.length)return finish();let e=state.events[state.day];document.getElementById('day').textContent=`יום ${state.day+1} מתוך ${state.length}`;document.getElementById('loc').textContent=e.loc;renderStats();document.getElementById('event').innerHTML=`<div class="scene-visual">${e.icon}</div><div class="scene-body"><h3 class="event-title">${e.title}</h3><p class="event-copy">${e.text}</p>${e.opts.map((o,i)=>`<button class="option" onclick="choose(${i})">${o[0]}<small>${o[1]}</small></button>`).join('')}</div>`}
function choose(i){let e=state.events[state.day],o=e.opts[i],luck=Math.random(),bonus=luck>.82?6:luck<.12?-5:0;Object.entries(o[2]).forEach(([k,v])=>state.stats[k]=Math.max(0,Math.min(100,state.stats[k]+v+(v>0?bonus:0))));if(!state.stamps.includes(e.stamp))state.stamps.push(e.stamp);state.route.push(e.loc);save();let mood=luck>.82?['✨','המזל הטאיוואני בצד שלכם.'][0]:luck<.12?'🌧️':'🧭';document.getElementById('event').innerHTML=`<div class="scene-body result"><div class="result-big">${mood}</div><h3 class="event-title">${o[0]}</h3><p class="event-copy">${luck>.82?'זה עבד אפילו טוב יותר מהמתוכנן.':luck<.12?'לא הכל הלך לפי התוכנית, אבל גם זה נכנס לסיפור.':'המסע קיבל כיוון חדש.'}</p><div class="delta">${Object.entries(o[2]).map(([k,v])=>`<span class="${v>0?'good':'bad'}">${icons[k]} ${v>0?'+':''}${v} ${labels[k]}</span>`).join('')}</div><button class="btn primary wide" onclick="nextDay()">ממשיכים ליום הבא ←</button></div>`;renderStats();updateCount()}
function nextDay(){state.day++;save();renderEvent();scrollTo(0,0)}
function finish(){let s=state.stats,score=(s.energy+s.budget+s.food+s.culture+s.joy)/5,grade=score>78?'S':score>66?'A':score>52?'B':'C';go('final');document.getElementById('finalTitle').textContent=`המסע של ${state.name}`;document.getElementById('grade').textContent=grade;document.getElementById('summary').textContent=grade==='S'?'טיול אגדי: ידעתם מתי לרוץ, מתי לעצור ומתי להזמין עוד מנה.':grade==='A'?'מסע מעולה, מלא בטעמים וברגעים שלא היו בתוכנית.':grade==='B'?'טיול אמיתי: קצת עייפות, הרבה סיפורים ורצון לחזור.':'שרדתם את טאיוואן בדרך שלכם. בפעם הבאה אורזים פחות ומתכננים פחות.';document.getElementById('route').innerHTML=state.route.map(x=>`<span>${x}</span>`).join('');renderStats('finalStats')}
function showCollection(){go('collection');let owned=new Set(JSON.parse(localStorage.getItem('tw-stamps')||'[]'));state.stamps.forEach(x=>owned.add(x));localStorage.setItem('tw-stamps',JSON.stringify([...owned]));document.getElementById('stamps').innerHTML=ALL.map(x=>`<div class="stamp ${owned.has(x.name)?'':'lock'}"><div><div class="emoji">${owned.has(x.name)?x.icon:'?'}</div><b>${x.name}</b></div></div>`).join('');updateCount()}
function updateCount(){let owned=new Set([...(JSON.parse(localStorage.getItem('tw-stamps')||'[]')),...state.stamps]);document.getElementById('stampCount').textContent=owned.size}function save(){localStorage.setItem('tw-game',JSON.stringify(state))}function restart(){localStorage.removeItem('tw-game');state.started=false;go('setup')}
updateCount();
</script></body></html>
